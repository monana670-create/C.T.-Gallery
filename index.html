<!DOCTYPE html><html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>C.T. Gallery</title>
  <meta name="description" content="C.T. Gallery - Image Archive">  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">  <link rel="stylesheet" href="style.css">
</head><body>  <header class="header">
    <div class="logo">
      <span>C.T.</span>
      <small>GALLERY</small>
    </div><nav class="header-nav">
  <button class="nav-btn active" data-target="gallery-section">WORKS</button>
  <button class="nav-btn" data-target="character-section">CHARACTER</button>
  <button class="nav-btn" data-target="worldview-section">WORLDVIEW</button>
</nav>

  </header>  <main><section class="intro">
  <p class="eyebrow">CREATIVE ARCHIVE / 2026</p>

  <h1>
    C.T.<br>
    <span>Gallery</span>
  </h1>

  <p class="description">
    이미지와 작업물을 한곳에 모아두는<br>
    개인 크리에이티브 아카이브입니다.
  </p>

  <div class="intro-line"></div>
</section>


<section id="gallery-section" class="content-section active">

  <div class="section-title">
    <div>
      <p class="section-number">01</p>
      <h2>ALL WORKS</h2>
    </div>

    <span id="image-count">LOADING...</span>
  </div>

  <div class="gallery" id="gallery"></div>

  <div class="pagination" id="pagination"></div>

</section>


<section id="character-section" class="content-section">

  <div class="section-title">
    <div>
      <p class="section-number">02</p>
      <h2>CHARACTER</h2>
    </div>

    <span>ARCHIVE</span>
  </div>

  <div class="tab-content-placeholder">
    <p>캐릭터 설정 관련 작업물과 데이터가 들어갈 공간입니다.</p>
  </div>

</section>


<section id="worldview-section" class="content-section">

  <div class="section-title">
    <div>
      <p class="section-number">03</p>
      <h2>WORLDVIEW</h2>
    </div>

    <span>ARCHIVE</span>
  </div>

  <div class="tab-content-placeholder">
    <p>세계관 설정 및 스토리 데이터가 들어갈 공간입니다.</p>
  </div>

</section>

  </main>  <footer>
    <span>© C.T. Gallery</span>
    <span>IMAGE ARCHIVE / 2026</span>
  </footer>  <script>

    const navButtons = document.querySelectorAll(".nav-btn");
    const contentSections = document.querySelectorAll(".content-section");

    navButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-target");

        navButtons.forEach(b => b.classList.remove("active"));
        contentSections.forEach(s => s.classList.remove("active"));

        btn.classList.add("active");
        document.getElementById(targetId).classList.add("active");
      });
    });


    const gallery = document.getElementById("gallery");
    const imageCount = document.getElementById("image-count");
    const pagination = document.getElementById("pagination");

    const owner = "monana670-create";
    const repo = "C.T.-Gallery";
    const folder = "images";

    const ITEMS_PER_PAGE = 9;

    let currentPage = 1;
    let allImageFiles = [];


    fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folder}`)
      .then(response => {
        if (!response.ok) {
          throw new Error("Network response was not ok");
        }

        return response.json();
      })

      .then(files => {

        if (Array.isArray(files)) {

          allImageFiles = files.filter(file =>
            /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)
          );

        } else {

          allImageFiles = [];

        }


        imageCount.textContent =
          String(allImageFiles.length).padStart(2, "0") + " IMAGES";


        if (allImageFiles.length === 0) {

          gallery.innerHTML =
            `<p class="error">등록된 이미지가 없습니다.</p>`;

        } else {

          renderPage(currentPage);

        }

      })

      .catch(error => {

        console.error("이미지를 불러오지 못했습니다.", error);

        imageCount.textContent = "00 IMAGES";

        gallery.innerHTML = `
          <p class="error">
            등록된 이미지가 없거나 불러오지 못했습니다.
          </p>
        `;

      });


    function renderPage(page) {

      gallery.innerHTML = "";

      const startIndex = (page - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;

      const pageFiles =
        allImageFiles.slice(startIndex, endIndex);


      pageFiles.forEach(file => {

        const item =
          document.createElement("div");

        item.className = "gallery-item";


        const img =
          document.createElement("img");

        img.src = file.download_url;
        img.alt = file.name;
        img.loading = "lazy";


        item.appendChild(img);
        gallery.appendChild(item);

      });


      renderPaginationButtons();

    }


    function renderPaginationButtons() {

      pagination.innerHTML = "";

      const totalPages =
        Math.ceil(
          allImageFiles.length / ITEMS_PER_PAGE
        );


      if (totalPages <= 1) return;


      const prevBtn =
        document.createElement("button");

      prevBtn.textContent = "←";

      prevBtn.disabled =
        currentPage === 1;


      prevBtn.addEventListener("click", () => {

        if (currentPage > 1) {

          currentPage--;

          renderPage(currentPage);

          scrollToGallery();

        }

      });


      pagination.appendChild(prevBtn);


      for (
        let i = 1;
        i <= totalPages;
        i++
      ) {

        const pageBtn =
          document.createElement("button");

        pageBtn.textContent = i;


        if (i === currentPage) {
          pageBtn.classList.add("active");
        }


        pageBtn.addEventListener("click", () => {

          currentPage = i;

          renderPage(currentPage);

          scrollToGallery();

        });


        pagination.appendChild(pageBtn);

      }


      const nextBtn =
        document.createElement("button");

      nextBtn.textContent = "→";

      nextBtn.disabled =
        currentPage === totalPages;


      nextBtn.addEventListener("click", () => {

        if (
          currentPage <
          totalPages
        ) {

          currentPage++;

          renderPage(currentPage);

          scrollToGallery();

        }

      });


      pagination.appendChild(nextBtn);

    }


    function scrollToGallery() {

      document
        .querySelector(".content-section.active")
        .scrollIntoView({
          behavior: "smooth"
        });

    }

  </script></body>
</html>
