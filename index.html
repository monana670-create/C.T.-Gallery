<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>C.T. Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==============================
       HEADER
  ============================== -->

  <header class="header">

    <div class="logo" data-target="home">
      C.T. GALLERY
    </div>

    <nav class="nav">
      <button data-target="home">HOME</button>
      <button data-target="works">WORKS</button>
      <button data-target="character">CHARACTER</button>
      <button data-target="worldview">WORLDVIEW</button>
    </nav>

  </header>


  <!-- ==============================
       HOME
  ============================== -->

  <main id="home">

    <!-- HERO -->

    <section class="hero">

      <img
        src="hero/main.gif"
        alt="C.T. Gallery"
        draggable="false"
      >

      <div class="hero-overlay">

        <div class="hero-small">
          CREATIVE ARCHIVE
        </div>

        <h1>
          C.T.<br>
          GALLERY
        </h1>

        <p>
          Characters, worlds and stories.
        </p>

      </div>

    </section>


    <!-- ==============================
         HOME DIVIDER IMAGE
         DM/main.jpg
    ============================== -->

    <div class="home-divider">

      <div class="divider-image">

        <img
          src="DM/main.jpg"
          alt=""
          draggable="false"
        >

      </div>

    </div>


    <!-- ==============================
         TODAY'S CHARACTER
    ============================== -->

    <section class="today-section">

      <div class="section-heading">

        <div>

          <span class="section-label">
            DAILY FEATURE
          </span>

          <h2>
            TODAY'S CHARACTER
          </h2>

        </div>

        <span
          id="today-date"
          class="today-date"
        ></span>

      </div>


      <div
        id="today-character-list"
        class="today-character-list"
      ></div>

    </section>



    <!-- ==============================
         WORKS
    ============================== -->

    <section
      id="works"
      class="content-section works-section"
    >

      <div class="section-heading">

        <div>

          <span class="section-label">
            ARCHIVE
          </span>

          <h2>
            WORKS
          </h2>

        </div>

        <span
          id="image-count"
          class="image-count"
        ></span>

      </div>


      <div
        id="gallery"
        class="gallery"
      ></div>


      <div
        id="pagination"
        class="pagination"
      ></div>

    </section>



    <!-- ==============================
         CHARACTER
    ============================== -->

    <section
      id="character"
      class="content-section"
    >

      <div class="section-heading">

        <div>

          <span class="section-label">
            ARCHIVE
          </span>

          <h2>
            CHARACTER
          </h2>

        </div>

      </div>


      <div
        id="character-list"
        class="archive-grid"
      ></div>

    </section>



    <!-- ==============================
         WORLDVIEW
    ============================== -->

    <section
      id="worldview"
      class="content-section"
    >

      <div class="section-heading">

        <div>

          <span class="section-label">
            ARCHIVE
          </span>

          <h2>
            WORLDVIEW
          </h2>

        </div>

      </div>


      <div
        id="worldview-list"
        class="archive-grid"
      ></div>

    </section>

  </main>



  <!-- ==============================
       LIGHTBOX
  ============================== -->

  <div
    id="lightbox"
    class="lightbox"
  >

    <button
      id="lightbox-close"
      class="lightbox-close"
    >
      ×
    </button>

    <img
      id="lightbox-image"
      src=""
      alt=""
    >

  </div>



  <!-- ==============================
       FOOTER
  ============================== -->

  <footer class="footer">

    <div class="footer-logo">
      C.T. GALLERY
    </div>

    <p>
      Characters · Worlds · Stories
    </p>

    <span>
      © 2026 C.T. Gallery
    </span>

  </footer>



  <!-- ==============================
       JAVASCRIPT
  ============================== -->

  <script>

    /* =================================
       CHARACTER DATA
    ================================= */

    const characters = [

      {
        title: "김유담",

        description:
          "메아리의 종착지. 한 사람만을 바라보며 자신의 세계를 잃어버린 여자.",

        image:
          "characters/images/yudam.png",

        link:
          "characters/yudam.html"
      }

      // 새로운 캐릭터는 이 아래에 추가
    ];



    /* =================================
       WORLDVIEW DATA
    ================================= */

    const worldviews = [

      {
        title: "은색 공방의 키메토리아",

        description:
          "153명의 키메라 학생들이 살아가는 하늘섬 알테리아의 이야기.",

        image:
          "worldviews/images/chimatoria.png",

        link:
          "worldviews/chimatoria.html"
      }

      // 새로운 세계관은 이 아래에 추가
    ];



    /* =================================
       PAGE NAVIGATION
    ================================= */

    const navButtons =
      document.querySelectorAll("[data-target]");


    navButtons.forEach(button => {

      button.addEventListener("click", () => {

        const target =
          button.dataset.target;

        if (target === "home") {

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

          return;
        }


        const section =
          document.getElementById(target);

        if (!section) return;


        section.scrollIntoView({
          behavior: "smooth"
        });

      });

    });



    /* =================================
       TODAY'S CHARACTER
    ================================= */

    const todayCharacterList =
      document.getElementById(
        "today-character-list"
      );

    const todayDate =
      document.getElementById(
        "today-date"
      );


    function getDateSeed() {

      const now = new Date();

      const year =
        now.getFullYear();

      const month =
        now.getMonth() + 1;

      const day =
        now.getDate();

      return (
        year * 10000 +
        month * 100 +
        day
      );

    }


    function seededRandom(seed) {

      const x =
        Math.sin(seed) * 10000;

      return x - Math.floor(x);

    }


    function shuffleCharacters(
      array,
      seed
    ) {

      const result =
        [...array];

      let currentSeed =
        seed;


      for (
        let i = result.length - 1;
        i > 0;
        i--
      ) {

        currentSeed += 1;

        const random =
          seededRandom(
            currentSeed
          );

        const j =
          Math.floor(
            random * (i + 1)
          );


        [
          result[i],
          result[j]
        ] =
        [
          result[j],
          result[i]
        ];

      }


      return result;

    }



    function renderTodayCharacters() {

      todayCharacterList.innerHTML =
        "";


      if (
        characters.length === 0
      ) {

        todayCharacterList.innerHTML = `

          <p class="empty-message">
            등록된 캐릭터가 없습니다.
          </p>

        `;

        return;

      }


      const seed =
        getDateSeed();


      const shuffled =
        shuffleCharacters(
          characters,
          seed
        );


      const selected =
        shuffled.slice(
          0,
          Math.min(3, shuffled.length)
        );


      const now =
        new Date();


      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          now.getDate()
        ).padStart(2, "0");


      todayDate.textContent =
        `${year}.${month}.${day}`;



      selected.forEach(
        (character, index) => {

          const card =
            document.createElement("a");


          card.href =
            character.link;


          card.className =
            "today-card";


          card.innerHTML = `

            <div class="today-image">

              <img
                src="${character.image}"
                alt="${character.title}"
                loading="lazy"
              >

              <span class="today-number">
                ${String(index + 1).padStart(2, "0")}
              </span>

            </div>


            <div class="today-info">

              <span class="today-type">
                TODAY'S CHARACTER
              </span>

              <h3>
                ${character.title}
              </h3>

              <p>
                ${character.description || ""}
              </p>

              <div class="today-view">

                <span>
                  VIEW CHARACTER
                </span>

                <b>
                  →
                </b>

              </div>

            </div>

          `;


          todayCharacterList.appendChild(
            card
          );

        }
      );

    }


    renderTodayCharacters();



    /* =================================
       CHARACTER ARCHIVE
    ================================= */

    const characterList =
      document.getElementById(
        "character-list"
      );


    characters.forEach(
      (character, index) => {

        characterList.innerHTML += `

          <a
            href="${character.link}"
            class="archive-card character-card"
          >

            <div class="archive-image">

              <img
                src="${character.image}"
                alt="${character.title}"
                loading="lazy"
              >

              <span class="archive-number">
                ${String(index + 1).padStart(2, "0")}
              </span>

            </div>


            <div class="archive-info">

              <span class="archive-type">
                CHARACTER
              </span>

              <h3>
                ${character.title}
              </h3>

              <p>
                ${character.description || ""}
              </p>

              <span class="archive-arrow">
                VIEW CHARACTER →
              </span>

            </div>

          </a>

        `;

      }
    );



    /* =================================
       WORLDVIEW ARCHIVE
    ================================= */

    const worldviewList =
      document.getElementById(
        "worldview-list"
      );


    worldviews.forEach(
      (worldview, index) => {

        worldviewList.innerHTML += `

          <a
            href="${worldview.link}"
            class="archive-card worldview-card"
          >

            <div class="archive-image">

              <img
                src="${worldview.image}"
                alt="${worldview.title}"
                loading="lazy"
              >

              <span class="archive-number">
                ${String(index + 1).padStart(2, "0")}
              </span>

            </div>


            <div class="archive-info">

              <span class="archive-type">
                WORLDVIEW
              </span>

              <h3>
                ${worldview.title}
              </h3>

              <p>
                ${worldview.description || ""}
              </p>

              <span class="archive-arrow">
                VIEW WORLDVIEW →
              </span>

            </div>

          </a>

        `;

      }
    );



    /* =================================
       WORKS
       GITHUB API
    ================================= */

    const owner =
      "monana670-create";

    const repo =
      "C.T.-Gallery";

    const folder =
      "images";

    const ITEMS_PER_PAGE =
      9;


    let allImages = [];

    let currentPage = 1;



    async function loadWorks() {

      const gallery =
        document.getElementById(
          "gallery"
        );


      try {

        const response =
          await fetch(
            `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
          );


        if (!response.ok) {

          throw new Error(
            "GitHub API error"
          );

        }


        const files =
          await response.json();


        allImages =
          files.filter(
            file => {

              const name =
                file.name.toLowerCase();


              return (
                name.endsWith(".jpg") ||
                name.endsWith(".jpeg") ||
                name.endsWith(".png") ||
                name.endsWith(".gif") ||
                name.endsWith(".webp")
              );

            }
          );


        document.getElementById(
          "image-count"
        ).textContent =
          `${allImages.length} WORKS`;


        renderPage();

      }
      catch (error) {

        console.error(error);


        gallery.innerHTML = `

          <p class="empty-message">
            작품을 불러오지 못했습니다.
          </p>

        `;

      }

    }



    function renderPage() {

      const gallery =
        document.getElementById(
          "gallery"
        );


      gallery.innerHTML =
        "";


      const start =
        (
          currentPage - 1
        ) * ITEMS_PER_PAGE;


      const end =
        start + ITEMS_PER_PAGE;


      const pageImages =
        allImages.slice(
          start,
          end
        );


      pageImages.forEach(
        file => {

          const item =
            document.createElement("div");


          item.className =
            "gallery-item";


          item.innerHTML = `

            <img
              src="${file.download_url}"
              alt="${file.name}"
              loading="lazy"
            >

          `;


          item.addEventListener(
            "click",
            () => {

              openLightbox(
                file.download_url,
                file.name
              );

            }
          );


          gallery.appendChild(
            item
          );

        }
      );


      renderPagination();

    }



    function renderPagination() {

      const pagination =
        document.getElementById(
          "pagination"
        );


      pagination.innerHTML =
        "";


      const totalPages =
        Math.ceil(
          allImages.length /
          ITEMS_PER_PAGE
        );


      if (totalPages <= 1) {
        return;
      }


      for (
        let i = 1;
        i <= totalPages;
        i++
      ) {

        const button =
          document.createElement("button");


        button.textContent =
          i;


        if (
          i === currentPage
        ) {

          button.classList.add(
            "active"
          );

        }


        button.addEventListener(
          "click",
          () => {

            currentPage =
              i;

            renderPage();


            document
              .getElementById("works")
              .scrollIntoView({
                behavior: "smooth"
              });

          }
        );


        pagination.appendChild(
          button
        );

      }

    }


    loadWorks();



    /* =================================
       LIGHTBOX
    ================================= */

    const lightbox =
      document.getElementById(
        "lightbox"
      );

    const lightboxImage =
      document.getElementById(
        "lightbox-image"
      );

    const lightboxClose =
      document.getElementById(
        "lightbox-close"
      );


    function openLightbox(
      src,
      alt
    ) {

      lightboxImage.src =
        src;

      lightboxImage.alt =
        alt;

      lightbox.classList.add(
        "active"
      );

      document.body.style.overflow =
        "hidden";

    }


    function closeLightbox() {

      lightbox.classList.remove(
        "active"
      );

      document.body.style.overflow =
        "";

    }


    lightboxClose.addEventListener(
      "click",
      closeLightbox
    );


    lightbox.addEventListener(
      "click",
      event => {

        if (
          event.target === lightbox
        ) {

          closeLightbox();

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeLightbox();

        }

      }
    );



    /* =================================
       DM IMAGE PARALLAX
    ================================= */

    const divider =
      document.querySelector(
        ".home-divider"
      );

    const dividerImage =
      document.querySelector(
        ".divider-image"
      );


    let ticking =
      false;


    function updateParallax() {

      if (!divider || !dividerImage) {
        return;
      }


      const rect =
        divider.getBoundingClientRect();


      const windowHeight =
        window.innerHeight;


      /*
        이미지가 화면에 들어오는 동안
        천천히 위아래로 움직인다.
      */

      const progress =
        (
          windowHeight - rect.top
        ) /
        (
          windowHeight + rect.height
        );


      const movement =
        (
          progress - 0.5
        ) * 80;


      dividerImage.style.transform =
        `translate3d(0, ${movement}px, 0)`;


      ticking =
        false;

    }


    function requestParallaxUpdate() {

      if (!ticking) {

        window.requestAnimationFrame(
          updateParallax
        );

        ticking =
          true;

      }

    }


    window.addEventListener(
      "scroll",
      requestParallaxUpdate,
      {
        passive: true
      }
    );


    window.addEventListener(
      "resize",
      requestParallaxUpdate
    );


    updateParallax();

  </script>

</body>
</html>
