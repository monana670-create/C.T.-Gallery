<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>C.T. Gallery</title>

  <link rel="stylesheet" href="style.css">

      <button class="nav-btn" data-target="worldview-section">WORLDVIEW</button>
    </nav>
  </header>


  <main>

    <section class="intro">
      <p class="eyebrow">CREATIVE ARCHIVE</p>

      <h1>
        C.T.<br>
        <span>Gallery</span>
      </h1>

      <p class="description">
        이미지와 작업물을 한곳에 모아두는<br>
        개인 갤러리입니다.
      </p>
    </section>


    <section id="gallery-section" class="content-section active">

      <div class="section-title">

      <div class="gallery" id="gallery"></div>

      <div class="pagination" id="pagination"></div>

    <section id="character-section" class="content-section">

      <div class="section-title">
        <h2>CHARACTER SETTINGS</h2>
        <span>ARCHIVE</span>

      <div class="tab-content-placeholder">
        <p>캐릭터 설정 관련 작업물과 데이터가 들어갈 공간입니다.</p>
      </div>

    </section>


    <section id="worldview-section" class="content-section">

      <div class="section-title">
        <h2>WORLDVIEW</h2>
        <span>ARCHIVE</span>
      </div>

      <div class="tab-content-placeholder">
        <p>세계관 설정 및 스토리 데이터가 들어갈 공간입니다.</p>
      </div>

    </section>

  </main>


  <footer>
    <span>© C.T. Gallery</span>
    <span>IMAGE ARCHIVE</span>
  </footer>

    const contentSections = document.querySelectorAll(".content-section");

    navButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-target");

        navButtons.forEach(b => b.classList.remove("active"));
        contentSections.forEach(s => s.classList.remove("active"));

        btn.classList.add("active");
        document.getElementById(targetId).classList.add("active");
      });
    });
