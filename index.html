<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   TAB SWITCH
========================= */

const navButtons =
  document.querySelectorAll(".nav-btn");


const contentSections =
  document.querySelectorAll(".content-section");


navButtons.forEach(btn => {


  btn.addEventListener("click", () => {


    const targetId =
      btn.getAttribute("data-target");


    const targetSection =
      document.getElementById(targetId);


    const currentSection =
      document.querySelector(
        ".content-section.active"
      );


    if (
      targetSection ===
      currentSection
    ) {
      return;
    }


    /* 버튼 변경 */

    navButtons.forEach(b => {

      b.classList.remove("active");

    });


    btn.classList.add("active");


    /* 기존 페이지 퇴장 */

    currentSection.classList.add(
      "leaving"
    );


    setTimeout(() => {


      currentSection.classList.remove(
        "active",
        "leaving"
      );


      /* 새로운 페이지 등장 */

      targetSection.classList.add(
        "active"
      );


      targetSection.scrollIntoView({

        behavior:
          "smooth",

        block:
          "start"

      });


    }, 350);


  });


});



/* =========================
   GITHUB WORKS GALLERY
========================= */

const gallery =
  document.getElementById(
    "gallery"
  );


const imageCount =
  document.getElementById(
    "image-count"
  );


const pagination =
  document.getElementById(
    "pagination"
  );



/* GitHub 정보 */

const owner =
  "monana670-create";


const repo =
  "C.T.-Gallery";


const folder =
  "images";



const ITEMS_PER_PAGE =
  9;


let currentPage =
  1;


let allImageFiles =
  [];



fetch(
  `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
)

  .then(response => {


    if (!response.ok) {

      throw new Error(
        "이미지를 불러오지 못했습니다."
      );

    }


    return response.json();


  })


  .then(files => {


    if (
      Array.isArray(files)
    ) {


      allImageFiles =
        files.filter(file =>

          /\.(jpg|jpeg|png|gif|webp)$/i
            .test(file.name)

        );


    }


    imageCount.textContent =

      String(
        allImageFiles.length
      )
        .padStart(2, "0")

      + " IMAGES";



    if (
      allImageFiles.length === 0
    ) {


      gallery.innerHTML =

        `
        <p class="error">
          등록된 이미지가 없습니다.
        </p>
        `;


    }


    else {


      renderPage(
        currentPage
      );


    }


  })


  .catch(error => {


    console.error(error);


    imageCount.textContent =
      "00 IMAGES";


    gallery.innerHTML =

      `
      <p class="error">
        이미지를 불러오지 못했습니다.
      </p>
      `;


  });



/* =========================
   IMAGE RENDER
========================= */

function renderPage(page) {


  gallery.innerHTML =
    "";


  const startIndex =

    (page - 1)
    *
    ITEMS_PER_PAGE;


  const endIndex =

    startIndex
    +
    ITEMS_PER_PAGE;


  const pageFiles =

    allImageFiles.slice(
      startIndex,
      endIndex
    );



  pageFiles.forEach(file => {


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "gallery-item";



    const img =
      document.createElement(
        "img"
      );


    img.src =
      file.download_url;


    img.alt =
      file.name;


    img.loading =
      "lazy";



    item.appendChild(
      img
    );


    gallery.appendChild(
      item
    );


  });



  renderPaginationButtons();


}



/* =========================
   PAGINATION
========================= */

function renderPaginationButtons() {


  pagination.innerHTML =
    "";


  const totalPages =

    Math.ceil(

      allImageFiles.length
      /
      ITEMS_PER_PAGE

    );


  if (
    totalPages <= 1
  ) {

    return;

  }



  /* PREVIOUS */

  const prevBtn =

    document.createElement(
      "button"
    );


  prevBtn.textContent =
    "←";


  prevBtn.disabled =
    currentPage === 1;



  prevBtn.addEventListener(
    "click",
    () => {


      if (
        currentPage > 1
      ) {


        currentPage--;


        renderPage(
          currentPage
        );


        scrollToActive();


      }


    }
  );


  pagination.appendChild(
    prevBtn
  );



  /* PAGE NUMBERS */

  for (

    let i = 1;

    i <= totalPages;

    i++

  ) {


    const pageBtn =

      document.createElement(
        "button"
      );


    pageBtn.textContent =
      i;


    if (
      i === currentPage
    ) {

      pageBtn.classList.add(
        "active"
      );

    }



    pageBtn.addEventListener(
      "click",
      () => {


        currentPage =
          i;


        renderPage(
          currentPage
        );


        scrollToActive();


      }
    );


    pagination.appendChild(
      pageBtn
    );


  }



  /* NEXT */

  const nextBtn =

    document.createElement(
      "button"
    );


  nextBtn.textContent =
    "→";


  nextBtn.disabled =

    currentPage ===
    totalPages;



  nextBtn.addEventListener(
    "click",
    () => {


      if (
        currentPage <
        totalPages
      ) {


        currentPage++;


        renderPage(
          currentPage
        );


        scrollToActive();


      }


    }
  );


  pagination.appendChild(
    nextBtn
  );


}

/* =========================
   ARCHIVE LIST RENDER
========================= */

function renderArchiveList(
  data,
  listId,
  countId
) {


  const list =
    document.getElementById(
      listId
    );


  const count =
    document.getElementById(
      countId
    );


  count.textContent =

    String(
      data.length
    )
      .padStart(2, "0")

    + " ARCHIVES";



  list.innerHTML =
    "";



  data.forEach((item, index) => {


    const article =
      document.createElement(
        "a"
      );


    article.className =
      "archive-item";


    article.href =
      item.link;



    /* 이미지가 있을 경우 */

    const imageArea =

      item.image

        ?

        `
        <div class="archive-image">
          <img
            src="${item.image}"
            alt="${item.title}"
          >
        </div>
        `

        :

        `
        <div class="archive-image archive-no-image">
          ${String(index + 1).padStart(2, "0")}
        </div>
        `;



    article.innerHTML =

      `

      ${imageArea}


      <div class="archive-info">


        <div class="archive-number">

          ARCHIVE

          ${String(index + 1)
            .padStart(2, "0")}

        </div>


        <h3>
          ${item.title}
        </h3>


        <p>
          ${item.description}
        </p>


      </div>


      <div class="archive-arrow">

        →

      </div>


      `;



    list.appendChild(
      article
    );


  });


}



/* =========================
   RENDER CHARACTER
========================= */

renderArchiveList(

  characters,

  "character-list",

  "character-count"

);



/* =========================
   RENDER WORLDVIEW
========================= */

renderArchiveList(

  worldviews,

  "worldview-list",

  "worldview-count"

);



/* =========================
   SCROLL
========================= */

function scrollToActive() {


  document

    .querySelector(
      ".content-section.active"
    )

    .scrollIntoView({

      behavior:
        "smooth"

    });


}


</script>
