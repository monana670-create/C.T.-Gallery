<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>C.T. Gallery</title>
<meta name="description" content="C.T. Gallery - Creative Archive">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background-glow glow-1"></div>
<div class="background-glow glow-2"></div>

<header class="header">

    <div class="logo">
        <span>C.T.</span>
        <small>GALLERY</small>
    </div>

    <nav class="header-nav">
        <button class="nav-btn active" data-target="home-section">HOME</button>
        <button class="nav-btn" data-target="gallery-section">WORKS</button>
        <button class="nav-btn" data-target="character-section">CHARACTER</button>
        <button class="nav-btn" data-target="worldview-section">WORLDVIEW</button>
    </nav>

    <button
        class="menu-toggle"
        id="menu-toggle"
        aria-label="Open menu"
        aria-expanded="false"
    >☰</button>

</header>

<div class="mobile-menu" id="mobile-menu">

    <button class="mobile-nav-btn active" data-target="home-section">
        HOME
    </button>

    <button class="mobile-nav-btn" data-target="gallery-section">
        WORKS
    </button>

    <button class="mobile-nav-btn" data-target="character-section">
        CHARACTER
    </button>

    <button class="mobile-nav-btn" data-target="worldview-section">
        WORLDVIEW
    </button>

</div>


<main>

<!-- =========================
     HOME
========================= -->

<section id="home-section" class="content-section active">

    <!-- HERO -->

    <section class="hero">

        <div class="hero-text">

            <span class="hero-label">
                CREATIVE ARCHIVE
            </span>

            <h1>
                C.T.<br>
                <span>GALLERY</span>
            </h1>

            <p>
                Characters, worlds and stories<br>
                created by C.T.
            </p>

            <button
                class="hero-button"
                id="explore-button"
            >
                EXPLORE WORKS
            </button>

        </div>

        <div class="hero-visual">

            <img
                src="hero/main.gif"
                alt="C.T. Gallery"
            >

        </div>

    </section>


    <!-- TODAY'S CHARACTER -->

    <section class="today-section">

        <div class="section-title">

            <span>01</span>

            <div>
                <small>CHARACTER ARCHIVE</small>
                <h2>TODAY'S CHARACTER</h2>
            </div>

        </div>

        <div
            class="today-grid"
            id="today-character"
        ></div>

    </section>

</section>


<!-- =========================
     WORKS
========================= -->

<section
    id="gallery-section"
    class="content-section"
>

    <div class="page-header">

        <span>02</span>

        <div>
            <small>CREATIVE ARCHIVE</small>
            <h2>WORKS</h2>
        </div>

    </div>

    <div
        class="gallery"
        id="gallery"
    ></div>

    <div
        class="pagination"
        id="pagination"
    ></div>

</section>


<!-- =========================
     CHARACTER
========================= -->

<section
    id="character-section"
    class="content-section"
>

    <div class="page-header">

        <span>03</span>

        <div>
            <small>CHARACTER ARCHIVE</small>
            <h2>CHARACTER</h2>
        </div>

    </div>

    <div
        class="archive-grid"
        id="character-list"
    ></div>

</section>


<!-- =========================
     WORLDVIEW
========================= -->

<section
    id="worldview-section"
    class="content-section"
>

    <div class="page-header">

        <span>04</span>

        <div>
            <small>WORLD ARCHIVE</small>
            <h2>WORLDVIEW</h2>
        </div>

    </div>

    <div
        class="archive-grid"
        id="worldview-list"
    ></div>

</section>

</main>


<!-- =========================
     LIGHTBOX
========================= -->

<div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
>

    <button
        class="lightbox-close"
        id="lightbox-close"
        aria-label="Close"
    >
        ×
    </button>

    <div class="lightbox-content">

        <img
            id="lightbox-image"
            src=""
            alt=""
        >

    </div>

</div>


<footer>

    <p>
        © C.T. Gallery
    </p>

</footer>


<script>

const owner = "monana670-create";
const repo = "C.T.-Gallery";
const folder = "images";

const ITEMS_PER_PAGE = 9;


/* =========================
   CHARACTER DATA
========================= */

const characters = [

    {
        title: "김유담",
        description: "메아리의 종착지",
        image: "characters/images/yudam.png",
        link: "characters/yudam.html"
    }

];


/* =========================
   WORLDVIEW DATA
========================= */

const worldviews = [

    {
        title: "은색 공방의 키메토리아",
        description: "알테리아와 키메라 아카데미의 기록",
        image: "worldviews/images/chimatoria.png",
        link: "worldviews/chimatoria.html"
    }

];


/* =========================
   MOBILE MENU
========================= */

const menuToggle = document.getElementById("menu-toggle");
const mobileMenu = document.getElementById("mobile-menu");

menuToggle.addEventListener("click", () => {

    const isOpen =
        mobileMenu.classList.toggle("open");

    menuToggle.setAttribute(
        "aria-expanded",
        isOpen
    );

});


/* =========================
   SECTION NAVIGATION
========================= */

const navButtons =
    document.querySelectorAll(
        ".nav-btn, .mobile-nav-btn"
    );

const sections =
    document.querySelectorAll(
        ".content-section"
    );


function showSection(targetId) {

    sections.forEach(section => {

        section.classList.toggle(
            "active",
            section.id === targetId
        );

    });


    navButtons.forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.target === targetId
        );

    });


    mobileMenu.classList.remove("open");

    menuToggle.setAttribute(
        "aria-expanded",
        "false"
    );

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


navButtons.forEach(button => {

    button.addEventListener("click", () => {

        showSection(
            button.dataset.target
        );

    });

});


/* =========================
   HERO EXPLORE BUTTON
========================= */

const exploreButton =
    document.getElementById(
        "explore-button"
    );

exploreButton.addEventListener(
    "click",
    () => {

        showSection(
            "gallery-section"
        );

    }
);


/* =========================
   TODAY'S CHARACTER
========================= */

function renderTodayCharacter() {

    const container =
        document.getElementById(
            "today-character"
        );

    if (!container) return;

    container.innerHTML = "";

    characters.forEach(character => {

        const card =
            document.createElement("a");

        card.className =
            "today-card";

        card.href =
            character.link;

        card.innerHTML = `

            <div class="today-image">

                <img
                    src="${character.image}"
                    alt="${character.title}"
                >

            </div>

            <div class="today-info">

                <small>CHARACTER</small>

                <h3>
                    ${character.title}
                </h3>

                <p>
                    ${character.description}
                </p>

                <span>
                    VIEW →
                </span>

            </div>

        `;

        container.appendChild(card);

    });

}


/* =========================
   GITHUB GALLERY
========================= */

const gallery =
    document.getElementById("gallery");

const pagination =
    document.getElementById("pagination");

let allImages = [];
let currentPage = 1;


async function fetchGallery() {

    try {

        const response =
            await fetch(
                `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
            );

        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }

        const files =
            await response.json();

        allImages =
            files
                .filter(file =>
                    /\.(jpg|jpeg|png|gif|webp)$/i
                    .test(file.name)
                )
                .sort((a, b) =>
                    a.name.localeCompare(
                        b.name,
                        undefined,
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    )
                );

        renderGallery();

    } catch (error) {

        console.error(error);

        gallery.innerHTML = `
            <div class="error-message">
                작품을 불러오지 못했습니다.
            </div>
        `;

    }

}


function renderGallery() {

    gallery.innerHTML = "";

    const start =
        (currentPage - 1)
        * ITEMS_PER_PAGE;

    const end =
        start + ITEMS_PER_PAGE;

    const pageImages =
        allImages.slice(
            start,
            end
        );


    pageImages.forEach(file => {

        const item =
            document.createElement("div");

        item.className =
            "gallery-item";


        const img =
            document.createElement("img");

        img.src =
            file.download_url;

        img.alt =
            file.name;

        img.loading =
            "lazy";


        item.appendChild(img);

        item.addEventListener(
            "click",
            () => {

                openLightbox(
                    file.download_url,
                    file.name
                );

            }
        );


        gallery.appendChild(item);

    });


    renderPagination();

}


function renderPagination() {

    pagination.innerHTML = "";

    const totalPages =
        Math.ceil(
            allImages.length
            / ITEMS_PER_PAGE
        );

    if (totalPages <= 1) return;


    for (
        let i = 1;
        i <= totalPages;
        i++
    ) {

        const button =
            document.createElement("button");

        button.textContent =
            i;

        button.className =
            i === currentPage
                ? "active"
                : "";


        button.addEventListener(
            "click",
            () => {

                currentPage = i;

                renderGallery();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }
        );


        pagination.appendChild(
            button
        );

    }

}


/* =========================
   CHARACTER ARCHIVE
========================= */

function renderCharacters() {

    const container =
        document.getElementById(
            "character-list"
        );

    if (!container) return;

    container.innerHTML = "";


    characters.forEach(character => {

        const card =
            document.createElement("a");

        card.className =
            "archive-card";

        card.href =
            character.link;


        card.innerHTML = `

            <div class="archive-image">

                <img
                    src="${character.image}"
                    alt="${character.title}"
                >

            </div>

            <div class="archive-info">

                <small>CHARACTER</small>

                <h3>
                    ${character.title}
                </h3>

                <p>
                    ${character.description}
                </p>

                <span>
                    VIEW →
                </span>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =========================
   WORLDVIEW ARCHIVE
========================= */

function renderWorldviews() {

    const container =
        document.getElementById(
            "worldview-list"
        );

    if (!container) return;

    container.innerHTML = "";


    worldviews.forEach(worldview => {

        const card =
            document.createElement("a");

        card.className =
            "archive-card";

        card.href =
            worldview.link;


        card.innerHTML = `

            <div class="archive-image">

                <img
                    src="${worldview.image}"
                    alt="${worldview.title}"
                >

            </div>

            <div class="archive-info">

                <small>WORLDVIEW</small>

                <h3>
                    ${worldview.title}
                </h3>

                <p>
                    ${worldview.description}
                </p>

                <span>
                    VIEW →
                </span>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =========================
   LIGHTBOX
========================= */

const lightbox =
    document.getElementById(
        "lightbox"
    );

const lightboxImage =
    document.getElementById(
        "lightbox-image"
    );

const lightboxClose =
    document.getElementById(
        "lightbox-close"
    );


function openLightbox(
    src,
    alt
) {

    lightboxImage.src =
        src;

    lightboxImage.alt =
        alt;

    lightbox.classList.add(
        "active"
    );

    lightbox.setAttribute(
        "aria-hidden",
        "false"
    );

}


function closeLightbox() {

    lightbox.classList.remove(
        "active"
    );

    lightbox.setAttribute(
        "aria-hidden",
        "true"
    );

    lightboxImage.src = "";

}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeLightbox();

        }

    }
);


/* =========================
   INITIALIZE
========================= */

renderTodayCharacter();
renderCharacters();
renderWorldviews();
fetchGallery();

</script>

</body>
</html>
