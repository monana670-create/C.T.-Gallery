<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>C.T. Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->
  <header class="header">

    <button
      class="menu-button"
      id="menuButton"
      aria-label="메뉴 열기"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="header-logo" onclick="showPage('home')">
      C.T. <span>GALLERY</span>
    </div>

  </header>


  <!-- =========================
       SIDE MENU
  ========================== -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <nav class="side-menu" id="sideMenu">

    <div class="side-menu-title">
      C.T. GALLERY
    </div>

    <div class="side-menu-line"></div>

    <button onclick="showPage('home')">
      HOME
    </button>

    <button onclick="showPage('works')">
      WORKS
    </button>

    <button onclick="showPage('characters')">
      CHARACTER
    </button>

    <button onclick="showPage('worldviews')">
      WORLDVIEW
    </button>

  </nav>


  <main>

    <!-- =========================
         HOME
    ========================== -->
    <section id="homePage" class="page active">

      <!-- ORIGINAL C.T. GALLERY HERO -->
      <section class="hero">

        <div class="hero-background"></div>

        <div class="hero-content">

          <p class="hero-small">
            CREATIVE ARCHIVE
          </p>

          <h1>
            C.T.
            <span>GALLERY</span>
          </h1>

          <div class="hero-divider"></div>

          <p class="hero-description">
            Characters, worlds and stories<br>
            created by 찰떡콩떡.
          </p>

          <button
            class="hero-button"
            onclick="showPage('works')"
          >
            EXPLORE WORKS
          </button>

        </div>

      </section>


      <!-- =========================
           LONG DECORATIVE BANNER
      ========================== -->
      <section class="home-divider">

        <div class="divider-image">
          <img
            src="DM/main.jpg"
            alt=""
            draggable="false"
          >
        </div>

      </section>


      <!-- =========================
           TODAY'S CHARACTER
      ========================== -->
      <section class="today-section">

        <div class="section-heading">

          <p>
            DAILY ARCHIVE
          </p>

          <h2>
            TODAY'S CHARACTER
          </h2>

          <span></span>

        </div>

        <div
          class="today-grid"
          id="todayCharacters"
        ></div>

      </section>

    </section>


    <!-- =========================
         WORKS
    ========================== -->
    <section id="worksPage" class="page">

      <div class="page-heading">

        <p>
          IMAGE ARCHIVE
        </p>

        <h2>
          WORKS
        </h2>

      </div>

      <div
        class="works-grid"
        id="worksGrid"
      ></div>

      <div
        class="pagination"
        id="pagination"
      ></div>

    </section>


    <!-- =========================
         CHARACTER
    ========================== -->
    <section id="charactersPage" class="page">

      <div class="page-heading">

        <p>
          CHARACTER ARCHIVE
        </p>

        <h2>
          CHARACTER
        </h2>

      </div>

      <div
        class="archive-grid"
        id="charactersGrid"
      ></div>

    </section>


    <!-- =========================
         WORLDVIEW
    ========================== -->
    <section id="worldviewsPage" class="page">

      <div class="page-heading">

        <p>
          WORLD ARCHIVE
        </p>

        <h2>
          WORLDVIEW
        </h2>

      </div>

      <div
        class="archive-grid"
        id="worldviewsGrid"
      ></div>

    </section>

  </main>


  <!-- =========================
       LIGHTBOX
  ========================== -->
  <div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
  >

    <button
      class="lightbox-close"
      id="lightboxClose"
      aria-label="닫기"
    >
      ×
    </button>

    <img
      id="lightboxImage"
      class="lightbox-image"
      src=""
      alt=""
    >

  </div>


  <!-- =========================
       SCRIPT
  ========================== -->
  <script>

    /* =========================================
       CHARACTER DATA
       여기서 자유롭게 추가 / 수정
    ========================================== */

    const characters = [

      {
        title: "김유담",

        description:
          "메아리의 종착지. 한 사람만을 바라보며 자신의 세계를 잃어버린 여자.",

        image:
          "characters/images/yudam.png",

        link:
          "characters/yudam.html"
      }

      // 새로운 캐릭터는 아래 형식으로 추가
      /*
      ,
      {
        title: "캐릭터 이름",

        description:
          "캐릭터 설명",

        image:
          "characters/images/example.png",

        link:
          "characters/example.html"
      }
      */

    ];


    /* =========================================
       WORLDVIEW DATA
       여기서 자유롭게 추가 / 수정
    ========================================== */

    const worldviews = [

      {
        title: "은색 공방의 키메토리아",

        description:
          "153명의 키메라 학생들이 살아가는 하늘섬 알테리아의 이야기.",

        image:
          "worldviews/images/chimatoria.png",

        link:
          "worldviews/chimatoria.html"
      }

      // 새로운 세계관 추가
      /*
      ,
      {
        title: "세계관 이름",

        description:
          "세계관 설명",

        image:
          "worldviews/images/example.png",

        link:
          "worldviews/example.html"
      }
      */

    ];


    /* =========================================
       MENU
    ========================================== */

    const menuButton =
      document.getElementById("menuButton");

    const sideMenu =
      document.getElementById("sideMenu");

    const menuOverlay =
      document.getElementById("menuOverlay");


    function openMenu() {

      sideMenu.classList.add("open");

      menuOverlay.classList.add("show");

      menuButton.classList.add("active");

      menuButton.setAttribute(
        "aria-expanded",
        "true"
      );

      document.body.classList.add("menu-open");

    }


    function closeMenu() {

      sideMenu.classList.remove("open");

      menuOverlay.classList.remove("show");

      menuButton.classList.remove("active");

      menuButton.setAttribute(
        "aria-expanded",
        "false"
      );

      document.body.classList.remove("menu-open");

    }


    menuButton.addEventListener(
      "click",
      () => {

        if (
          sideMenu.classList.contains("open")
        ) {

          closeMenu();

        } else {

          openMenu();

        }

      }
    );


    menuOverlay.addEventListener(
      "click",
      closeMenu
    );


    /* =========================================
       PAGE NAVIGATION
    ========================================== */

    function showPage(page) {

      document
        .querySelectorAll(".page")
        .forEach(section => {

          section.classList.remove("active");

        });


      const target =
        document.getElementById(
          page + "Page"
        );


      if (!target) return;


      target.classList.add("active");

      closeMenu();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });


      if (page === "works") {

        loadWorks();

      }

    }


    /* =========================================
       CHARACTER RENDER
    ========================================== */

    function renderCharacters() {

      const container =
        document.getElementById(
          "charactersGrid"
        );


      container.innerHTML = "";


      characters.forEach(character => {

        const card =
          document.createElement("article");

        card.className =
          "archive-card";


        card.innerHTML = `

          <a
            href="${character.link}"
            class="archive-image"
          >

            <img
              src="${character.image}"
              alt="${character.title}"
              loading="lazy"
            >

          </a>

          <div class="archive-info">

            <h3>
              ${character.title}
            </h3>

            <p>
              ${character.description}
            </p>

            <a
              href="${character.link}"
              class="read-more"
            >
              VIEW CHARACTER →
            </a>

          </div>

        `;


        container.appendChild(card);

      });

    }


    /* =========================================
       WORLDVIEW RENDER
    ========================================== */

    function renderWorldviews() {

      const container =
        document.getElementById(
          "worldviewsGrid"
        );


      container.innerHTML = "";


      worldviews.forEach(world => {

        const card =
          document.createElement("article");

        card.className =
          "archive-card";


        card.innerHTML = `

          <a
            href="${world.link}"
            class="archive-image"
          >

            <img
              src="${world.image}"
              alt="${world.title}"
              loading="lazy"
            >

          </a>

          <div class="archive-info">

            <h3>
              ${world.title}
            </h3>

            <p>
              ${world.description}
            </p>

            <a
              href="${world.link}"
              class="read-more"
            >
              VIEW WORLD →
            </a>

          </div>

        `;


        container.appendChild(card);

      });

    }


    /* =========================================
       TODAY'S CHARACTER
       날짜에 따라 최대 3명 랜덤 선택
       같은 날짜에는 같은 캐릭터가 나옴
    ========================================== */

    function renderTodayCharacters() {

      const container =
        document.getElementById(
          "todayCharacters"
        );


      container.innerHTML = "";


      if (
        characters.length === 0
      ) {

        container.innerHTML = `
          <p class="empty-message">
            No characters yet.
          </p>
        `;

        return;

      }


      const today =
        new Date();


      const seed =
        today.getFullYear() * 10000 +
        (today.getMonth() + 1) * 100 +
        today.getDate();


      const shuffled =
        [...characters];


      let random =
        seed;


      for (
        let i = shuffled.length - 1;
        i > 0;
        i--
      ) {

        random =
          (random * 9301 + 49297) % 233280;


        const j =
          Math.floor(
            (random / 233280) * (i + 1)
          );


        [
          shuffled[i],
          shuffled[j]
        ] =
        [
          shuffled[j],
          shuffled[i]
        ];

      }


      const selected =
        shuffled.slice(
          0,
          Math.min(3, shuffled.length)
        );


      selected.forEach(character => {

        const card =
          document.createElement("article");

        card.className =
          "today-card";


        card.innerHTML = `

          <a
            href="${character.link}"
            class="today-image"
          >

            <img
              src="${character.image}"
              alt="${character.title}"
              loading="lazy"
            >

          </a>

          <div class="today-info">

            <span>
              TODAY'S PICK
            </span>

            <h3>
              ${character.title}
            </h3>

            <p>
              ${character.description}
            </p>

          </div>

        `;


        container.appendChild(card);

      });

    }


    /* =========================================
       WORKS
       GitHub API
    ========================================== */

    const owner =
      "monana670-create";

    const repo =
      "C.T.-Gallery";

    const folder =
      "images";

    const ITEMS_PER_PAGE =
      9;


    let works = [];

    let currentPage = 1;


    async function loadWorks() {

      const grid =
        document.getElementById(
          "worksGrid"
        );


      grid.innerHTML = `
        <p class="loading-message">
          LOADING...
        </p>
      `;


      try {

        const response =
          await fetch(
            `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
          );


        if (!response.ok) {

          throw new Error(
            "GitHub API Error"
          );

        }


        const files =
          await response.json();


        works =
          files
            .filter(file => {

              if (
                file.type !== "file"
              ) return false;


              return /\.(jpg|jpeg|png|gif|webp)$/i
                .test(file.name);

            })
            .sort((a, b) =>
              a.name.localeCompare(
                b.name,
                undefined,
                {
                  numeric: true,
                  sensitivity: "base"
                }
              )
            );


        currentPage = 1;

        renderWorks();

      } catch (error) {

        console.error(error);


        grid.innerHTML = `
          <p class="loading-message">
            WORKS를 불러오지 못했습니다.
          </p>
        `;

      }

    }


    function renderWorks() {

      const grid =
        document.getElementById(
          "worksGrid"
        );


      grid.innerHTML = "";


      const start =
        (currentPage - 1) *
        ITEMS_PER_PAGE;


      const end =
        start + ITEMS_PER_PAGE;


      const currentWorks =
        works.slice(
          start,
          end
        );


      if (
        currentWorks.length === 0
      ) {

        grid.innerHTML = `
          <p class="loading-message">
            등록된 이미지가 없습니다.
          </p>
        `;

        return;

      }


      currentWorks.forEach(file => {

        /*
          thumbnail은 1:1
          클릭 시 file.download_url
          원본을 그대로 표시
        */

        const item =
          document.createElement("button");


        item.type =
          "button";


        item.className =
          "work-item";


        item.innerHTML = `

          <div class="work-thumbnail">

            <img
              src="${file.download_url}"
              alt="${file.name}"
              loading="lazy"
              draggable="false"
            >

            <div class="work-overlay">
              VIEW
            </div>

          </div>

        `;


        item.addEventListener(
          "click",
          () => {

            openLightbox(
              file.download_url,
              file.name
            );

          }
        );


        grid.appendChild(item);

      });


      renderPagination();

    }


    /* =========================================
       PAGINATION
    ========================================== */

    function renderPagination() {

      const container =
        document.getElementById(
          "pagination"
        );


      container.innerHTML = "";


      const totalPages =
        Math.ceil(
          works.length /
          ITEMS_PER_PAGE
        );


      if (
        totalPages <= 1
      ) return;


      for (
        let i = 1;
        i <= totalPages;
        i++
      ) {

        const button =
          document.createElement("button");


        button.textContent =
          i;


        button.className =
          i === currentPage
            ? "active"
            : "";


        button.addEventListener(
          "click",
          () => {

            currentPage =
              i;

            renderWorks();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          }
        );


        container.appendChild(
          button
        );

      }

    }


    /* =========================================
       LIGHTBOX
       원본 비율 그대로 표시
    ========================================== */

    const lightbox =
      document.getElementById(
        "lightbox"
      );


    const lightboxImage =
      document.getElementById(
        "lightboxImage"
      );


    const lightboxClose =
      document.getElementById(
        "lightboxClose"
      );


    function openLightbox(
      src,
      alt
    ) {

      lightboxImage.src =
        src;

      lightboxImage.alt =
        alt;


      lightbox.classList.add(
        "show"
      );


      lightbox.setAttribute(
        "aria-hidden",
        "false"
      );


      document.body.classList.add(
        "lightbox-open"
      );

    }


    function closeLightbox() {

      lightbox.classList.remove(
        "show"
      );


      lightbox.setAttribute(
        "aria-hidden",
        "true"
      );


      document.body.classList.remove(
        "lightbox-open"
      );


      setTimeout(() => {

        lightboxImage.src =
          "";

      }, 200);

    }


    lightboxClose.addEventListener(
      "click",
      closeLightbox
    );


    lightbox.addEventListener(
      "click",
      event => {

        if (
          event.target === lightbox
        ) {

          closeLightbox();

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeLightbox();

        }

      }
    );


    /* =========================================
       HOME BANNER PARALLAX
    ========================================== */

    const divider =
      document.querySelector(
        ".home-divider"
      );


    const dividerImage =
      document.querySelector(
        ".divider-image"
      );


    let parallaxTicking =
      false;


    function updateParallax() {

      if (
        !divider ||
        !dividerImage
      ) return;


      const rect =
        divider.getBoundingClientRect();


      const windowHeight =
        window.innerHeight;


      const progress =
        (
          windowHeight -
          rect.top
        ) /
        (
          windowHeight +
          rect.height
        );


      const movement =
        (progress - 0.5) * 70;


      dividerImage.style.transform =
        `translate3d(0, ${movement}px, 0)`;


      parallaxTicking =
        false;

    }


    function requestParallaxUpdate() {

      if (
        !parallaxTicking
      ) {

        window.requestAnimationFrame(
          updateParallax
        );

        parallaxTicking =
          true;

      }

    }


    window.addEventListener(
      "scroll",
      requestParallaxUpdate,
      {
        passive: true
      }
    );


    window.addEventListener(
      "resize",
      requestParallaxUpdate
    );


    /* =========================================
       INITIALIZE
    ========================================== */

    renderCharacters();

    renderWorldviews();

    renderTodayCharacters();

    updateParallax();

  </script>

</body>
</html>
